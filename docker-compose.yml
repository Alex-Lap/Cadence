services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cadence:cadence@db:5432/cadence
    ports: ["8000:8000"]
    volumes: [".:/srv"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
