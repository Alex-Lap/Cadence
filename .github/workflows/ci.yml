name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cadence"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cadence:cadence@localhost:5432/cadence
      TEST_DATABASE_URL: postgresql+psycopg://cadence:cadence@localhost:5432/cadence_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - run: pytest -q

  web:
    name: Web lint and type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type-check (route types generated first)
        run: npx next typegen && npx tsc --noEmit
